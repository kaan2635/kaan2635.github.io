<style>

  main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }

  p { color: var(--dim); line-height: 1.6; margin: 0; }
  a { color: var(--gold); }
  .app { display:flex; gap:16px; align-items:center; background: var(--card); border-radius: 16px; padding: 14px 16px; margin-top: 16px; text-decoration:none; }
  .app img { width:64px; height:64px; border-radius:15px; flex-shrink:0; }
  .app b { display:block; color: var(--text); font-size: 17px; }
  .app span { color: var(--dim); font-size: 14px; }
  footer { margin-top: 32px; }
</style>
</head>
